# Tool changer: linear rack, 20 pockets along Y at the X- end. Included from
# biber3ax.ini (#INCLUDE), read by remap/toolchange.ngc and postgui.hal.
# Tool number = pocket number. All positions are machine coordinates (G53).

[TOOLCHANGER]
# Approach position in front of a pocket = pocket X + X_OFFSET
X_OFFSET = 106.02
# X back-off after depositing a tool = pocket X + X_BACKOFF
X_BACKOFF = 106.02
# X MIN_LIMIT while the tool change area is enabled ([AXIS_X]MIN_LIMIT = work area)
X_MIN_LIMIT = 0
# Z clearance when picking (last move onto the tool at FEED)
Z_CHECK = 10
# Deposit: Z lift at FEED out of the released tool, before the drawbar goes up
RELEASE_Z = 17
# Flush air: deposit = G0 lift after RELEASE_Z; pick = last FLUSH_Z above the pocket
FLUSH_Z = 60
# HSK dust seal dummy plug: tool / pocket number, in the spindle while boring
DUMMY_TOOL = 17
# Feed into / out of pockets and for the last Z move onto a tool [mm/min]
FEED = 25000
# X/Y acceleration [mm/s²] during M6 and M210, restored afterwards (remap/accel_*.ngc)
RAPID_ACCEL_XY = 6500

# Tool height probe (M210, remap/m210.ngc). Machine coordinates.
PROBE_X = 301.82
PROBE_Y = 91.99
# X is moved here first if below it, and again after probing
PROBE_X_CLEAR = 301.82
# Rapid down to here before probing (lower it to just above the longest tool to save time)
PROBE_Z_START = 0
# Probing ends here without a trigger -> abort (no tool / broken tool)
PROBE_Z_MIN = -174
# Machine Z of the spindle gauge line touching the probe: tool length = trigger Z - PROBE_Z_REF
# Placeholder - measure.
PROBE_Z_REF = -244
# Two-stage probe: fast search, back off until released (max RELEASE_MAX) + BACKOFF,
# then the measuring touch at PROBE_FEED within SLOW_TRAVEL. Feeds [mm/min], distances [mm].
PROBE_FAST_FEED = 3000
PROBE_RELEASE_MAX = 5
PROBE_BACKOFF = 0.5
PROBE_FEED = 100
PROBE_SLOW_TRAVEL = 1

# Pockets measured: 2, 3, 7, 9, 15, 20
