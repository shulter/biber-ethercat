# Weeke Vantage 33M — final 3-axis machine config (X dual gantry + Y + Z)
# 4x StepperOnline A6 EtherCAT servos (X left, X right, Y, Z)
# Machine I/O (Beckhoff EK1100 + terminals) is wired in io.hal, the spindle
# (EL4032 0-10V to VFD) in ethercat.hal.
# Uses the jerk-limited (S-curve) trajectory planner (MAX_JERK below) — requires
# a LinuxCNC build with S-curve TP support; drop the MAX_JERK lines to fall back
# to the trapezoidal planner on older builds.
# See docs/retrofit-plan.md and docs/kinematics.md

[EMC]
MACHINE = Vantage 33M
DEBUG = 0
VERSION = 1.1

[DISPLAY]
DISPLAY = axis
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 1.0
DEFAULT_LINEAR_VELOCITY = 100
MAX_LINEAR_VELOCITY = 1215
MIN_LINEAR_VELOCITY = 0.5
INCREMENTS = 50mm 10mm 1mm .5mm .1mm .05mm .01mm
EDITOR = gedit
GEOMETRY = xyz
CYCLE_TIME = 100
OPEN_FILE = ""
# Spindle display range (EL4032, 0-10V = 0-24000 RPM into the VFD)
MIN_SPINDLE_0_SPEED = 0
MAX_SPINDLE_0_SPEED = 24000
DEFAULT_SPINDLE_0_SPEED = 12000
MIN_SPINDLE_0_OVERRIDE = 0.5
MAX_SPINDLE_0_OVERRIDE = 1.0
# PyVCP panel: servo torque (+/-11 Nm) and speed (0-6000 RPM) bars for all 4
# servos + commanded spindle speed (0-24000 RPM). AXIS renders it in the pane
# right of the g-code preview. See panel.xml / postgui.hal.
PYVCP = panel.xml

[FILTER]
PROGRAM_EXTENSION = .ngc,.nc G-Code

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[RS274NGC]
PARAMETER_FILE = linuxcnc.var
RS274NGC_STARTUP_CODE = G21 G40 G90 G94 G97 G64 P0.005
# Remapped M-codes (subroutines in remap/):
#   M250 — release the tool (HSK drawbar), with spindle-off / not-turning checks
#   M251 — clamp the tool again
#   M200 — lower the dust hood
#   M201 — raise the dust hood
#   M231 — raise (activate) all reg pins
#   M230 — lower all reg pins
#   M241 — vacuum pump on, both zones (left + right ports open)
#   M242 — vacuum pump on, left zone only
#   M243 — vacuum pump on, right zone only
#   M240 — vacuum pump off, both ports closed
SUBROUTINE_PATH = remap
REMAP = M250 modalgroup=10 ngc=m250
REMAP = M251 modalgroup=10 ngc=m251
REMAP = M200 modalgroup=10 ngc=m200
REMAP = M201 modalgroup=10 ngc=m201
REMAP = M230 modalgroup=10 ngc=m230
REMAP = M231 modalgroup=10 ngc=m231
REMAP = M240 modalgroup=10 ngc=m240
REMAP = M241 modalgroup=10 ngc=m241
REMAP = M242 modalgroup=10 ngc=m242
REMAP = M243 modalgroup=10 ngc=m243

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[HAL]
HALUI = halui
HALFILE = ethercat.hal
HALFILE = io.hal
POSTGUI_HALFILE = postgui.hal

[HALUI]

[KINS]
JOINTS = 4
KINEMATICS = trivkins coordinates=XXYZ kinstype=BOTH

[TRAJ]
COORDINATES = X Y Z
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 100
MAX_LINEAR_VELOCITY = 1215
NO_FORCE_HOMING = 1
# Jerk-limited (S-curve) trajectory planner — 10x MAX_ACCELERATION, see docs/kinematics.md
MAX_JERK = 20000
ARC_BLEND_OPTIMIZATION_DEPTH = 200
PLANNER_TYPE = 0 # 0 is trapezoidal, 1 is s-curve

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

# --- Homing (all axes) ---
# Each joint homes onto a limit switch (Beckhoff EL1018, wired in io.hal),
# which doubles as the home switch: X and Z in the + direction onto their
# positive limit switch, Y in the - direction onto its switch at the Y0 end.
# HOME_OFFSET is the switch's position, placed just beyond the soft limit so
# normal moves up to it don't trip the hard limit. After latching, each joint
# moves to its HOME (Y: 200). Homing order: Z (1), then both X joints together
# (-2, negative = tandem), then Y (3). Measure where each switch really trips
# and correct HOME_OFFSET / soft limits (see docs/kinematics.md).

# --- X axis (dual-motor gantry, rack & pinion) ---
# pos-scale 10434.4 counts/mm — see docs/kinematics.md

[AXIS_X]
MAX_VELOCITY = 1215
MAX_ACCELERATION = 1000
MAX_JERK = 20000
MIN_LIMIT = 0
MAX_LIMIT = 3978

[JOINT_0]
TYPE = LINEAR
# X finishes homing a bit before the end of the machining table
HOME = 3900
MAX_VELOCITY = 1215
MAX_ACCELERATION = 1000
MAX_JERK = 8000
MIN_LIMIT = 0
MAX_LIMIT = 3978
FERROR = 50
MIN_FERROR = 50
HOME_OFFSET = 3980
HOME_SEQUENCE = -2
HOME_SEARCH_VEL = 50
HOME_LATCH_VEL = 2
HOME_FINAL_VEL = 100
HOME_IGNORE_LIMITS = YES
HOME_USE_INDEX = NO
# Negative: with the gantry motors mounted mirrored, x-left is the one that
# turns "backwards" relative to machine +X (see docs/kinematics.md).
CIA402_POS_SCALE = -10434.4

[JOINT_1]
TYPE = LINEAR
# X finishes homing a bit before the end of the machining table
HOME = 3900
MAX_VELOCITY = 1215
MAX_ACCELERATION = 1000
MAX_JERK = 8000
MIN_LIMIT = 0
MAX_LIMIT = 3978
FERROR = 50
MIN_FERROR = 50
HOME_OFFSET = 3980
HOME_SEQUENCE = -2
HOME_SEARCH_VEL = 50
HOME_LATCH_VEL = 2
HOME_FINAL_VEL = 100
HOME_IGNORE_LIMITS = YES
HOME_USE_INDEX = NO
# Positive: mirrored to x-left (joint 0, negative) — see docs/kinematics.md.
CIA402_POS_SCALE = 10434.4

# --- Y axis (ball screw via belt reduction) ---
# pos-scale 13107.2 counts/mm — see docs/kinematics.md

[AXIS_Y]
MAX_VELOCITY = 967
MAX_ACCELERATION = 4000
MAX_JERK = 8000
MIN_LIMIT = 0
MAX_LIMIT = 1732

[JOINT_2]
TYPE = LINEAR
# Y homes in the - direction onto its switch at the Y0 end and finishes at Y200.
HOME = 200
MAX_VELOCITY = 967
MAX_ACCELERATION = 4000
MAX_JERK = 8000
MIN_LIMIT = 0
MAX_LIMIT = 1732
FERROR = 50
MIN_FERROR = 50
# Switch position: 2 mm below MIN_LIMIT (placeholder — measure the real trip point).
HOME_OFFSET = -2
HOME_SEQUENCE = 3
HOME_SEARCH_VEL = -50
HOME_LATCH_VEL = -2
HOME_FINAL_VEL = 100
HOME_IGNORE_LIMITS = YES
HOME_USE_INDEX = NO
CIA402_POS_SCALE = 13107.2

# --- Z axis (direct ball screw) ---
# pos-scale 26214.4 counts/mm — see docs/kinematics.md
# Home is at the top (Z=0, MAX_LIMIT); search moves up (+) toward the switch.

[AXIS_Z]
MAX_VELOCITY = 250
MAX_ACCELERATION = 5000
MAX_JERK = 20000
MIN_LIMIT = -155
MAX_LIMIT = 0.1

[JOINT_3]
TYPE = LINEAR
HOME = 0.0
MAX_VELOCITY = 250
MAX_ACCELERATION = 5000
MAX_JERK = 20000
MIN_LIMIT = -155
MAX_LIMIT = 0.6
FERROR = 20
MIN_FERROR = 20
# Z switch trips 1 mm above Z0.
HOME_OFFSET = 1
HOME_SEQUENCE = 1
HOME_SEARCH_VEL = 20
HOME_LATCH_VEL = 1
HOME_FINAL_VEL = 100
HOME_IGNORE_LIMITS = YES
HOME_USE_INDEX = NO
CIA402_POS_SCALE = 26214.4
