# Week Vantage 33M — final 3-axis machine config (X dual gantry + Y + Z)
# 4x StepperOnline A6 EtherCAT servos (X left, X right, Y, Z)
# Machine I/O (Beckhoff EK1100 + terminals) and spindle (EL4032) are wired in
# io.hal / ethercat.hal but commented out until the EK1100 coupler is on the bus.
# See docs/retrofit-plan.md and docs/kinematics.md

[EMC]
MACHINE = Vantage 33M
DEBUG = 0
VERSION = 1.1

[DISPLAY]
DISPLAY = axis
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 1.0
DEFAULT_LINEAR_VELOCITY = 100
MAX_LINEAR_VELOCITY = 1215
MIN_LINEAR_VELOCITY = 0.5
INCREMENTS = 50mm 10mm 1mm .5mm .1mm .05mm .01mm
EDITOR = gedit
GEOMETRY = xyz
CYCLE_TIME = 100
OPEN_FILE = ""
# Spindle display range (EL4032, 0-10V = 0-24000 RPM) — uncomment once spindle is wired
# MIN_SPINDLE_0_SPEED = 0
# MAX_SPINDLE_0_SPEED = 24000
# DEFAULT_SPINDLE_0_SPEED = 12000
# MIN_SPINDLE_0_OVERRIDE = 0.5
# MAX_SPINDLE_0_OVERRIDE = 1.0

[FILTER]
PROGRAM_EXTENSION = .ngc,.nc G-Code

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[RS274NGC]
PARAMETER_FILE = linuxcnc.var
RS274NGC_STARTUP_CODE = G21 G40 G90 G94 G97 G64 P0.005

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[HAL]
HALUI = halui
HALFILE = ethercat.hal
HALFILE = io.hal

[HALUI]

[KINS]
JOINTS = 4
KINEMATICS = trivkins coordinates=XXYZ kinstype=BOTH

[TRAJ]
COORDINATES = X Y Z
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 100
MAX_LINEAR_VELOCITY = 1215
NO_FORCE_HOMING = 0

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

# --- X axis (dual-motor gantry, rack & pinion) ---
# pos-scale 10434.4 counts/mm — see docs/kinematics.md

[AXIS_X]
MAX_VELOCITY = 1215
MAX_ACCELERATION = 5000
MIN_LIMIT = 0
MAX_LIMIT = 3780

[JOINT_0]
TYPE = LINEAR
HOME = 0.0
MAX_VELOCITY = 1215
MAX_ACCELERATION = 5000
MIN_LIMIT = 0
MAX_LIMIT = 3780
FERROR = 50
MIN_FERROR = 5
HOME_OFFSET = 0.0
HOME_SEQUENCE = -1
HOME_SEARCH_VEL = -50
HOME_LATCH_VEL = -10
HOME_FINAL_VEL = -5
HOME_IGNORE_LIMITS = YES
HOME_USE_INDEX = NO
CIA402_POS_SCALE = 10434.4

[JOINT_1]
TYPE = LINEAR
HOME = 0.0
MAX_VELOCITY = 1215
MAX_ACCELERATION = 5000
MIN_LIMIT = 0
MAX_LIMIT = 3780
FERROR = 50
MIN_FERROR = 5
HOME_OFFSET = 0.0
HOME_SEQUENCE = -1
HOME_SEARCH_VEL = -50
HOME_LATCH_VEL = -10
HOME_FINAL_VEL = -5
HOME_IGNORE_LIMITS = YES
HOME_USE_INDEX = NO
CIA402_POS_SCALE = 10434.4

# --- Y axis (ball screw via belt reduction) ---
# pos-scale 13107.2 counts/mm — see docs/kinematics.md

[AXIS_Y]
MAX_VELOCITY = 967
MAX_ACCELERATION = 5000
MIN_LIMIT = 0
MAX_LIMIT = 1651

[JOINT_2]
TYPE = LINEAR
HOME = 0.0
MAX_VELOCITY = 967
MAX_ACCELERATION = 5000
MIN_LIMIT = 0
MAX_LIMIT = 1651
FERROR = 50
MIN_FERROR = 5
HOME_OFFSET = 0.0
HOME_SEQUENCE = 1
HOME_SEARCH_VEL = -50
HOME_LATCH_VEL = -10
HOME_FINAL_VEL = -5
HOME_IGNORE_LIMITS = YES
HOME_USE_INDEX = NO
CIA402_POS_SCALE = 13107.2

# --- Z axis (direct ball screw) ---
# pos-scale 26214.4 counts/mm — see docs/kinematics.md
# Home is at the top (Z=0, MAX_LIMIT); search moves up (+) toward the switch.

[AXIS_Z]
MAX_VELOCITY = 250
MAX_ACCELERATION = 5000
MIN_LIMIT = -155
MAX_LIMIT = 0

[JOINT_3]
TYPE = LINEAR
HOME = 0.0
MAX_VELOCITY = 250
MAX_ACCELERATION = 5000
MIN_LIMIT = -155
MAX_LIMIT = 0
FERROR = 50
MIN_FERROR = 5
HOME_OFFSET = 0.0
HOME_SEQUENCE = 2
HOME_SEARCH_VEL = 50
HOME_LATCH_VEL = 10
HOME_FINAL_VEL = 5
HOME_IGNORE_LIMITS = YES
HOME_USE_INDEX = NO
CIA402_POS_SCALE = 26214.4
