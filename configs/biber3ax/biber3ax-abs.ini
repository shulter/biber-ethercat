# Offsets for the A6 absolute encoders, read by biber3ax-abs.sh. Not startable: run ./biber3ax-abs.sh
# (see README).

[ABS_ENCODER]
# Joint position = drive position / CIA402_POS_SCALE + offset. Measure after a switch homing
# with biber3ax.ini: ./biber3ax-abs.sh measure. Re-measure after the drive's multi-turn data is reset.

JOINT_0_HOME_OFFSET = 2144.2870
JOINT_1_HOME_OFFSET = 2138.4010
JOINT_2_HOME_OFFSET = 540.3457
JOINT_3_HOME_OFFSET = -4.6549
