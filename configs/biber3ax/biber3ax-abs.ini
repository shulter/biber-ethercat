# biber3ax.ini with the A6 absolute encoders (battery-backed multi-turn): Home All sets the joints
# homed at once, no switch search, no motion. Everything else comes from biber3ax.ini, regenerated
# by abs-ini.sh on every start (see README).
#INCLUDE $(./abs-ini.sh)

[ABS_ENCODER]
# Joint position = drive position / CIA402_POS_SCALE + offset. Measure after a switch homing
# with biber3ax.ini: ./abs-ini.sh measure. Re-measure after the drive's multi-turn data is reset.

JOINT_0_HOME_OFFSET = 2144.2870
JOINT_1_HOME_OFFSET = 2138.4010
JOINT_2_HOME_OFFSET = 540.3457
JOINT_3_HOME_OFFSET = -4.6549
