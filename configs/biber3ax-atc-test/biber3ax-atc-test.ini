# Week Vantage 33M — ATC test config
# 3 servos, 3 axes: single-motor X (no gantry, for bench test mode), Y, Z.
# A HSK63F ATC / drill / tool-height-probe toolchanger is layered on top via
# M6 and M106 remapping — see README.md and remap/.
# Uses the jerk-limited (S-curve) trajectory planner (MAX_JERK below) — requires
# a LinuxCNC build with S-curve TP support; drop the MAX_JERK lines to fall back
# to the trapezoidal planner on older builds.
# See docs/retrofit-plan.md and docs/kinematics.md

[EMC]
MACHINE = Vantage 33M ATC Test
DEBUG = 0
VERSION = 1.1

[DISPLAY]
DISPLAY = axis
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 1.0
DEFAULT_LINEAR_VELOCITY = 50
MAX_LINEAR_VELOCITY = 200
MIN_LINEAR_VELOCITY = 0.5
INCREMENTS = 50mm 10mm 1mm .5mm .1mm .05mm .01mm
EDITOR = gedit
GEOMETRY = xyz
CYCLE_TIME = 100
OPEN_FILE = ""
# PyVCP panel: servo torque bars + numeric readouts (0-12 Nm). Renders in the
# pane to the right of the g-code preview automatically. See panel.xml /
# postgui.hal.
PYVCP = panel.xml

[FILTER]
PROGRAM_EXTENSION = .ngc,.nc G-Code

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[RS274NGC]
PARAMETER_FILE = linuxcnc.var
RS274NGC_STARTUP_CODE = G21 G40 G90 G94 G97 G64 P0.005
SUBROUTINE_PATH = ./remap
# M6: HSK63F ATC (T1-T20) / vertical drills (T101-T107) / horizontal drills
#     (T201-T204) toolchanger. M106: tool height probing. M107/M108: deploy/
#     retract the Marposs workpiece touch probe. See remap/ and README.md
# "Tool Changer" / "Tool Height Probing" / "Workpiece Touch Probe (Marposs)"
# for the full picture and what still needs on-machine verification.
REMAP=M6   modalgroup=6   ngc=m6_remap
REMAP=M106 modalgroup=10  argspec=T  ngc=m106_remap
REMAP=M107 modalgroup=10  ngc=m107_remap
REMAP=M108 modalgroup=10  ngc=m108_remap

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[HAL]
HALUI = halui
HALFILE = ethercat.hal
HALFILE = io.hal
POSTGUI_HALFILE = postgui.hal

[HALUI]

[KINS]
JOINTS = 3
KINEMATICS = trivkins coordinates=XYZ kinstype=BOTH

[TRAJ]
COORDINATES = X Y Z
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 50
MAX_LINEAR_VELOCITY = 200
NO_FORCE_HOMING = 1
# Jerk-limited (S-curve) trajectory planner — 10x MAX_ACCELERATION, see docs/kinematics.md
MAX_JERK = 5000

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

# --- X axis (single motor, rack & pinion — no gantry in bench test mode) ---
# Full machine travel: 3780 mm, max vel ~1215 mm/s, max accel 5000 mm/s²
# Bench limits are reduced — expand when mounted on machine

[AXIS_X]
MAX_VELOCITY = 200
MAX_ACCELERATION = 500
MAX_JERK = 5000
MIN_LIMIT = -500
MAX_LIMIT = 500

[JOINT_0]
TYPE = LINEAR
HOME = 0.0
MAX_VELOCITY = 200
MAX_ACCELERATION = 500
MAX_JERK = 5000
MIN_LIMIT = -500
MAX_LIMIT = 500
FERROR = 50
MIN_FERROR = 5
HOME_OFFSET = 0.0
HOME_SEQUENCE = 0
HOME_SEARCH_VEL = -50
HOME_LATCH_VEL = -10
HOME_FINAL_VEL = -5
HOME_IGNORE_LIMITS = YES
HOME_USE_INDEX = NO
CIA402_POS_SCALE = 10434.4

# --- Y axis (ball screw via belt reduction) ---
# Full machine travel: 0-1651 mm, max vel ~967 mm/s, max accel 5000 mm/s²
# Bench limits are reduced — expand when mounted on machine

[AXIS_Y]
MAX_VELOCITY = 200
MAX_ACCELERATION = 500
MAX_JERK = 5000
MIN_LIMIT = 0
MAX_LIMIT = 500

[JOINT_1]
TYPE = LINEAR
HOME = 0.0
MAX_VELOCITY = 200
MAX_ACCELERATION = 500
MAX_JERK = 5000
MIN_LIMIT = 0
MAX_LIMIT = 500
FERROR = 50
MIN_FERROR = 5
HOME_OFFSET = 0.0
HOME_SEQUENCE = 1
HOME_SEARCH_VEL = -50
HOME_LATCH_VEL = -10
HOME_FINAL_VEL = -5
HOME_IGNORE_LIMITS = YES
HOME_USE_INDEX = NO
CIA402_POS_SCALE = 13107.2

# --- Z axis (direct ball screw) ---
# pos-scale 26214.4 counts/mm — see docs/kinematics.md. Full-machine values
# (not bench-reduced): the ATC pockets/probe/drills need real Z travel to
# reach, and their positions (remap/atc-positions.ngc) are placeholders
# pending measurement anyway, so there's no bench-scale version of this axis.
# Verify a Z servo is actually present before homing/running this config.

[AXIS_Z]
MAX_VELOCITY = 250
MAX_ACCELERATION = 5000
MAX_JERK = 50000
MIN_LIMIT = -155
MAX_LIMIT = 0

[JOINT_2]
TYPE = LINEAR
HOME = 0.0
MAX_VELOCITY = 250
MAX_ACCELERATION = 5000
MAX_JERK = 50000
MIN_LIMIT = -155
MAX_LIMIT = 0
FERROR = 50
MIN_FERROR = 5
HOME_OFFSET = 0.0
HOME_SEQUENCE = 2
HOME_SEARCH_VEL = 50
HOME_LATCH_VEL = 10
HOME_FINAL_VEL = 5
HOME_IGNORE_LIMITS = YES
HOME_USE_INDEX = NO
CIA402_POS_SCALE = 26214.4
