# Week Vantage 33M — X gantry + Y axis bench test config
# 2× StepperOnline A6 EtherCAT servos on X axis (dual-motor gantry) + 1× on Y axis
# Uses the jerk-limited (S-curve) trajectory planner (MAX_JERK below) — requires
# a LinuxCNC build with S-curve TP support; drop the MAX_JERK lines to fall back
# to the trapezoidal planner on older builds.
# See docs/retrofit-plan.md and docs/kinematics.md

[EMC]
MACHINE = Vantage 33M X/Y Bench
DEBUG = 0
VERSION = 1.1

[DISPLAY]
DISPLAY = axis
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 1.0
DEFAULT_LINEAR_VELOCITY = 50
MAX_LINEAR_VELOCITY = 200
MIN_LINEAR_VELOCITY = 0.5
INCREMENTS = 50mm 10mm 1mm .5mm .1mm .05mm .01mm
EDITOR = gedit
GEOMETRY = xy
CYCLE_TIME = 100
OPEN_FILE = ""

[FILTER]
PROGRAM_EXTENSION = .ngc,.nc G-Code

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[RS274NGC]
PARAMETER_FILE = linuxcnc.var
RS274NGC_STARTUP_CODE = G21 G40 G90 G94 G97 G64 P0.005

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[HAL]
HALUI = halui
HALFILE = ethercat.hal

[HALUI]

[KINS]
JOINTS = 3
KINEMATICS = trivkins coordinates=XXY kinstype=BOTH

[TRAJ]
COORDINATES = X Y
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 50
MAX_LINEAR_VELOCITY = 200
NO_FORCE_HOMING = 1
# Jerk-limited (S-curve) trajectory planner — 10x MAX_ACCELERATION, see docs/kinematics.md
MAX_JERK = 5000

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

# --- X axis (dual-motor gantry) ---
# Full machine travel: 3780 mm, max vel ~1215 mm/s, max accel 5000 mm/s²
# Bench limits are reduced — expand when mounted on machine

[AXIS_X]
MAX_VELOCITY = 200
MAX_ACCELERATION = 500
MAX_JERK = 5000
MIN_LIMIT = -500
MAX_LIMIT = 500

[JOINT_0]
TYPE = LINEAR
HOME = 0.0
MAX_VELOCITY = 200
MAX_ACCELERATION = 500
MAX_JERK = 5000
MIN_LIMIT = -500
MAX_LIMIT = 500
FERROR = 50
MIN_FERROR = 5
HOME_OFFSET = 0.0
HOME_SEQUENCE = -1
HOME_SEARCH_VEL = -50
HOME_LATCH_VEL = -10
HOME_FINAL_VEL = -5
HOME_IGNORE_LIMITS = YES
HOME_USE_INDEX = NO
CIA402_POS_SCALE = 10434.4

[JOINT_1]
TYPE = LINEAR
HOME = 0.0
MAX_VELOCITY = 200
MAX_ACCELERATION = 500
MAX_JERK = 5000
MIN_LIMIT = -500
MAX_LIMIT = 500
FERROR = 50
MIN_FERROR = 5
HOME_OFFSET = 0.0
HOME_SEQUENCE = -1
HOME_SEARCH_VEL = -50
HOME_LATCH_VEL = -10
HOME_FINAL_VEL = -5
HOME_IGNORE_LIMITS = YES
HOME_USE_INDEX = NO
CIA402_POS_SCALE = 10434.4

# --- Y axis (ball screw via belt reduction) ---
# Full machine travel: 0-1651 mm, max vel ~967 mm/s, max accel 5000 mm/s²
# Bench limits are reduced — expand when mounted on machine

[AXIS_Y]
MAX_VELOCITY = 200
MAX_ACCELERATION = 500
MAX_JERK = 5000
MIN_LIMIT = 0
MAX_LIMIT = 500

[JOINT_2]
TYPE = LINEAR
HOME = 0.0
MAX_VELOCITY = 200
MAX_ACCELERATION = 500
MAX_JERK = 5000
MIN_LIMIT = 0
MAX_LIMIT = 500
FERROR = 50
MIN_FERROR = 5
HOME_OFFSET = 0.0
HOME_SEQUENCE = 1
HOME_SEARCH_VEL = -50
HOME_LATCH_VEL = -10
HOME_FINAL_VEL = -5
HOME_IGNORE_LIMITS = YES
HOME_USE_INDEX = NO
CIA402_POS_SCALE = 13107.2

